<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEMS – Student Information and Enrollment Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4fa;--card:#ffffff;--tx:#141b2d;--mu:#667085;--bd:#e3e8f2;--ac:#3b4cca;--ac2:#7a5af8;--ok:#128a4a;--wn:#b45309;--bad:#c42b2b;--sh:0 1px 2px rgba(20,27,45,.05),0 8px 24px rgba(20,27,45,.07);--r:16px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1018;--card:#141b27;--tx:#e9eef7;--mu:#98a4b8;--bd:#263042;--ac:#8a95ff;--ac2:#b39bff;--ok:#4ade80;--wn:#fbbf24;--bad:#f87171;--sh:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1018;--card:#141b27;--tx:#e9eef7;--mu:#98a4b8;--bd:#263042;--ac:#8a95ff;--ac2:#b39bff;--ok:#4ade80;--wn:#fbbf24;--bad:#f87171;--sh:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;gap:14px;align-items:center}
.brand{display:flex;gap:12px;align-items:center}.brand b{display:block;font-size:17px;line-height:1.1;letter-spacing:.02em;font-weight:800}.brand small{color:var(--mu);font-size:12px}
.lg{font-style:normal;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 12px rgba(91,76,230,.35)}
.sp{flex:1}.pill{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:600}.pill:empty{display:none}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:28px 18px 40px}
footer{text-align:center;color:var(--mu);font-size:12.5px;padding:18px;border-top:1px solid var(--bd)}
.hd{margin:2px 0 22px}.hd h1{margin:0 0 2px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:var(--sh)}
h2{margin:0 0 14px;font-size:17px;font-weight:700}
button{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 16px;cursor:pointer;transition:all .15s}button:hover{border-color:var(--ac);transform:translateY(-1px)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(91,76,230,.3)}button.g{background:var(--ok);border-color:var(--ok);color:#fff}button.d{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}button.w{width:100%;padding:12px;margin-top:6px}
input,select{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px 12px;width:100%;transition:border-color .15s}input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
label{display:block;font-size:13px;font-weight:600;color:var(--tx);margin:12px 0 5px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--bg)}th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}tr:last-child td{border-bottom:0}tbody tr:hover td,table tr:not(:first-child):hover td{background:color-mix(in srgb,var(--ac) 4%,transparent)}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,currentColor 13%,transparent)}.Pending{color:var(--wn)}.Approved,.Paid,.Passed{color:var(--ok)}.Rejected,.Unpaid,.Failed{color:var(--bad)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--bd);color:var(--tx);font-size:14px;margin:0;font-weight:400;cursor:pointer}.chk:hover{background:color-mix(in srgb,var(--ac) 4%,transparent)}.chk input{width:auto;margin-top:4px;accent-color:var(--ac)}.chk.off{opacity:.5;cursor:not-allowed}
.mu{color:var(--mu);font-size:13px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border-left:4px solid var(--ac)}.stat b{font-size:26px;display:block;line-height:1.3;font-weight:800}
.auth{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:stretch;margin-top:12px}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:44px 40px;color:#fff;background:linear-gradient(135deg,#2a2f9e 0%,#5b4ce6 55%,#8f6bff 100%);display:flex;flex-direction:column;justify-content:center;min-height:460px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}.hero::before{width:320px;height:320px;right:-90px;top:-90px}.hero::after{width:220px;height:220px;left:-60px;bottom:-70px}
.hero>*{position:relative}.hero h1{margin:18px 0 10px;font-size:38px;line-height:1.1;font-weight:800;letter-spacing:-.02em}.hero p{opacity:.92;margin:0 0 22px;font-size:16px;max-width:380px}.hero .lg{background:rgba(255,255,255,.2);box-shadow:none;width:46px;height:46px;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500}
.form{margin:0;padding:26px}.tabs{display:flex;background:var(--bg);border-radius:12px;padding:5px;margin-bottom:10px}.tabs button{flex:1;border:0;background:none;padding:10px}.tabs button:hover{transform:none}.tabs button.on{background:var(--card);box-shadow:var(--sh);font-weight:700;color:var(--ac)}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#t{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:9;box-shadow:var(--sh);font-weight:500}#t.show{opacity:1}#t.bad{background:var(--bad);color:#fff}
.inl{display:flex;gap:6px;flex-wrap:wrap}.inl input{min-width:100px;flex:1}
@media (max-width:760px){.auth{grid-template-columns:1fr}.hero{padding:28px 24px;min-height:0}.hero h1{font-size:28px}header{padding:10px 14px}.brand small{display:none}.hd h1{font-size:23px}}
</style></head><body>
<header><div class="brand"><i class="lg">S</i><div><b>SEMS</b><small>Student Enrollment and Records</small></div></div><div class="sp"></div><span id="who" class="pill"></span><button id="lo" onclick="logout()" style="display:none">Log out</button></header>
<main id="app"></main><footer>SEMS · Student Information and Enrollment Management System · Platform Technologies Final Project</footer><div id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Configuration: paste your Supabase project values (Project Settings > API) ===== */
const CFG={url:"https://edgbbujkmodutaarblne.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkZ2JidWprbW9kdXRhYXJibG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNDYyMTYsImV4cCI6MjEwOTYyMjIxNn0.01Hn5MZq591SFmgAdUOP0rWSKkrH8ndurVwx-75CnZo"};
const configured=!CFG.url.includes("YOUR_");
const sb=configured?supabase.createClient(CFG.url,CFG.key):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,bad){const t=$("#t");t.textContent=m;t.className="show "+(bad?"bad":"");clearTimeout(toast.h);toast.h=setTimeout(()=>t.className="",3500)}
const peso=n=>"₱"+Number(n).toLocaleString();
const tag=s=>`<span class="tag ${s}">${s}</span>`;
const q=async p=>{const{data,error}=await p;if(error)throw error;return data};
const call=async(p,ok)=>{const{error}=await p;if(error)toast(error.message,1);else toast(ok);await render()};
let me=null,mode="in",SUBS=[];
const codes=e=>(e.enrollment_items||[]).map(i=>i.subject_code);
async function loadMe(){const{data:{user}}=await sb.auth.getUser();if(!user){me=null;return}const{data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();me=error?null:data}
function setMode(m){mode=m;render()}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("#u").value.trim(),password:$("#p").value});if(error)return toast(error.message,1);await loadMe();render()}
async function logout(){await sb.auth.signOut();me=null;render()}
async function register(){const v=i=>$("#"+i).value,name=v("rn").trim(),email=v("re").trim(),pw=v("rw");
 if(name.length<3)return toast("Enter your full name.",1);
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return toast("Enter a valid email address.",1);
 if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw))return toast("Password needs 8+ characters with letters and digits.",1);
 if(pw!==v("rw2"))return toast("Passwords do not match.",1);
 const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name,program:v("rg")}}});
 if(error)return toast(error.message,1);
 if(data.session){await loadMe();toast("Account created. Welcome!");render()}else{mode="in";render();toast("Check your email to confirm your account, then sign in.")}}
const greet=()=>`<div class="hd"><h1>Welcome, ${esc(me.full_name.split(" ")[0]||me.role)}</h1><span class="mu">${{Student:"Enroll in subjects and track your grades.",Registrar:"Review enrollments and monitor student records.",Cashier:"Verify payments for submitted enrollments.",Faculty:"Post grades for your enrolled students."}[me.role]}</span></div>`;
function vSetup(){return `<div class="card" style="max-width:640px;margin:30px auto"><h2>Setup needed</h2><p>Open <b>index.html</b>, find <code>CFG</code> near the top of the script and paste your Supabase <b>Project URL</b> and <b>anon key</b>. See README.md for the full steps.</p></div>`}
function vLogin(){const reg=mode==="up";return `<div class="auth"><section class="hero"><i class="lg">S</i><h1>Enroll online.<br>Skip the line.</h1><p>One secure portal for students, the registrar, the cashier and faculty.</p><div class="chips"><span>Prerequisite checks</span><span>Payment verification</span><span>Registrar approval</span><span>Instant grades</span></div></section>
<section class="card form"><div class="tabs"><button class="${reg?"":"on"}" onclick="setMode('in')">Sign in</button><button class="${reg?"on":""}" onclick="setMode('up')">Register</button></div>`+(reg?
`<label>Full name</label><input id="rn" autocomplete="name"><label>Email</label><input id="re" type="email" autocomplete="email"><label>Program</label><select id="rg"><option>BS Information Technology</option><option>BS Computer Science</option><option>BS Information Systems</option></select><div class="row"><div><label>Password</label><input id="rw" type="password" autocomplete="new-password"></div><div><label>Confirm password</label><input id="rw2" type="password" autocomplete="new-password"></div></div><p class="mu">8+ characters with letters and digits. Your Student ID is generated for you.</p><button class="p w" onclick="register()">Create student account</button>`:
`<label>Email</label><input id="u" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="event.key==='Enter'&&login()"><p><button class="p w" onclick="login()">Sign in</button></p>`)+`</section></div>`}
async function vStudent(){
 const[subs,enr,gr]=await Promise.all([q(sb.from("subjects").select("*").order("code")),q(sb.from("enrollments").select("*,enrollment_items(subject_code)").order("id")),q(sb.from("grades").select("*"))]);SUBS=subs;
 const sub=c=>subs.find(s=>s.code===c),pass=c=>gr.some(g=>g.subject_code===c&&g.grade<=3);
 const cur=enr.find(e=>e.status!=="Rejected"),last=enr[enr.length-1];
 const tu=gr.reduce((a,g)=>a+sub(g.subject_code).units,0),gwa=gr.length?(gr.reduce((a,g)=>a+g.grade*sub(g.subject_code).units,0)/tu).toFixed(2):"–";
 let enrl;
 if(cur)enrl=`<div class="tw"><table><tr><th>Subject</th><th>Units</th></tr>${codes(cur).map(s=>`<tr><td>${s} – ${esc(sub(s).title)}</td><td>${sub(s).units}</td></tr>`).join("")}</table></div><p>Status: ${tag(cur.status)} Payment: ${tag(cur.paid?"Paid":"Unpaid")} <span class="mu">Assessed fee ${peso(cur.fee)}${cur.or_no?" · OR "+esc(cur.or_no):""}</span></p>`;
 else enrl=(last?`<p class="mu">Last request rejected: ${esc(last.note)}</p>`:"")+subs.filter(s=>!pass(s.code)).map(s=>{const ok=!s.prereq||pass(s.prereq);return `<label class="chk ${ok?"":"off"}"><input type="checkbox" class="sub" value="${s.code}" ${ok?"":"disabled"} onchange="calc()"><span>${s.code} – ${esc(s.title)} <span class="mu">(${s.units} units${s.prereq?" · prereq "+s.prereq:""}${ok?"":" – not met"})</span></span></label>`}).join("")+`<p>Selected: <b id="tu">0</b> units · Estimated fee: <b id="tf">${peso(0)}</b> <span class="mu">(₱1,000/unit + ₱1,500 misc.)</span></p><button class="p" onclick="submitEnroll()">Submit enrollment</button>`;
 return `<div class="stats"><div class="stat"><span class="mu">Student ID</span><b style="font-size:17px">${esc(me.student_no)}</b></div><div class="stat"><span class="mu">Program</span><b style="font-size:15px">${esc(me.program)}</b></div><div class="stat"><span class="mu">GWA</span><b>${gwa}</b></div></div>
 <div class="card"><h2>Online enrollment</h2>${enrl}</div>
 <div class="card"><h2>Grades</h2><div class="tw"><table><tr><th>Subject</th><th>Grade</th><th>Remarks</th></tr>${gr.map(g=>`<tr><td>${g.subject_code} – ${esc(sub(g.subject_code).title)}</td><td>${Number(g.grade).toFixed(2)}</td><td>${tag(g.grade<=3?"Passed":"Failed")}</td></tr>`).join("")||`<tr><td colspan=3 class="mu">No grades yet.</td></tr>`}</table></div></div>`}
function calc(){const cs=[...document.querySelectorAll(".sub:checked")].map(x=>x.value),u=cs.reduce((a,c)=>a+SUBS.find(s=>s.code===c).units,0);$("#tu").textContent=u;$("#tf").textContent=peso(cs.length?u*1000+1500:0)}
const submitEnroll=()=>call(sb.rpc("submit_enrollment",{codes:[...document.querySelectorAll(".sub:checked")].map(x=>x.value)}),"Enrollment submitted. Please pay at the Cashier.");
const allEnr=()=>q(sb.from("enrollments").select("*,profiles(full_name,student_no),enrollment_items(subject_code)").order("id",{ascending:false}));
const pay=id=>call(sb.rpc("record_payment",{eid:id,or_no:$("#or"+id).value.trim()}),"Payment recorded.");
const decide=(id,ok)=>call(sb.rpc("decide_enrollment",{eid:id,approve:ok,note:ok?"":$("#n"+id).value}),"Enrollment "+(ok?"approved":"rejected")+".");
const postGrade=(sid,code)=>call(sb.rpc("post_grade",{sid,code,g:parseFloat($("#g"+sid.slice(0,8)+code).value)}),"Grade posted to the student portal.");
async function vCashier(){const e=await allEnr();return `<div class="card"><h2>Payment verification</h2><div class="tw"><table><tr><th>#</th><th>Student</th><th>Fee</th><th>Status</th><th>OR number</th></tr>${e.map(x=>`<tr><td>${x.id}</td><td>${esc(x.profiles.full_name)}<div class="mu">${esc(x.profiles.student_no)}</div></td><td>${peso(x.fee)}</td><td>${tag(x.paid?"Paid":"Unpaid")}</td><td>${x.paid?esc(x.or_no):`<div class="inl"><input id="or${x.id}" placeholder="OR-0001"><button class="g" onclick="pay(${x.id})">Record</button></div>`}</td></tr>`).join("")||`<tr><td colspan=5 class="mu">No enrollments yet.</td></tr>`}</table></div></div>`}
async function vRegistrar(){
 const[e,st,lg]=await Promise.all([allEnr(),q(sb.from("profiles").select("*").eq("role","Student").order("student_no")),q(sb.from("audit_log").select("*,profiles(full_name)").order("id",{ascending:false}).limit(15))]);
 return `<div class="stats"><div class="stat"><span class="mu">Students</span><b>${st.length}</b></div><div class="stat"><span class="mu">Pending</span><b>${e.filter(x=>x.status==="Pending").length}</b></div><div class="stat"><span class="mu">Approved</span><b>${e.filter(x=>x.status==="Approved").length}</b></div></div>
 <div class="card"><h2>Enrollment approval</h2><div class="tw"><table><tr><th>Student</th><th>Subjects</th><th>Payment</th><th>Decision</th></tr>${e.map(x=>`<tr><td>${esc(x.profiles.full_name)}<div class="mu">#${x.id} · ${esc(x.profiles.student_no)}</div></td><td>${codes(x).join(", ")}</td><td>${tag(x.paid?"Paid":"Unpaid")}</td><td>${x.status==="Pending"?`<div class="inl"><button class="g" onclick="decide(${x.id},true)">Approve</button><input id="n${x.id}" placeholder="Reason if rejecting"><button class="d" onclick="decide(${x.id},false)">Reject</button></div>`:tag(x.status)}</td></tr>`).join("")||`<tr><td colspan=4 class="mu">No enrollments yet.</td></tr>`}</table></div></div>
 <div class="card"><h2>Student records</h2><div class="tw"><table><tr><th>ID</th><th>Name</th><th>Program</th><th>Email</th></tr>${st.map(u=>`<tr><td>${esc(u.student_no)}</td><td>${esc(u.full_name)}</td><td>${esc(u.program)}</td><td>${esc(u.email)}</td></tr>`).join("")}</table></div></div>
 <div class="card"><h2>Audit log</h2><div class="mu">${lg.map(l=>esc(new Date(l.created_at).toLocaleString()+" · "+(l.profiles?.full_name||"")+" · "+l.action)).join("<br>")||"No activity yet."}</div></div>`}
async function vFaculty(){
 const mine=await q(sb.from("subjects").select("*").eq("faculty_id",me.id).order("code"));
 if(!mine.length)return `<div class="card"><p class="mu">No subjects are assigned to you yet. Ask the administrator to assign subjects (see README).</p></div>`;
 const cs=mine.map(s=>s.code);
 const[rows,gr]=await Promise.all([q(sb.from("enrollment_items").select("subject_code,enrollments!inner(student_id,status,profiles(full_name,student_no))").in("subject_code",cs).eq("enrollments.status","Approved")),q(sb.from("grades").select("*").in("subject_code",cs))]);
 return mine.map(s=>{const r=rows.filter(x=>x.subject_code===s.code);return `<div class="card"><h2>${s.code} – ${esc(s.title)}</h2>${r.length?`<div class="tw"><table><tr><th>Student</th><th>Grade</th><th></th></tr>${r.map(x=>{const sid=x.enrollments.student_id,g=gr.find(y=>y.student_id===sid&&y.subject_code===s.code);return `<tr><td>${esc(x.enrollments.profiles.full_name)}<div class="mu">${esc(x.enrollments.profiles.student_no)}</div></td><td style="width:120px"><input id="g${sid.slice(0,8)}${s.code}" type="number" step="0.25" min="1" max="5" value="${g?g.grade:""}"></td><td><button class="p" onclick="postGrade('${sid}','${s.code}')">Post</button></td></tr>`}).join("")}</table></div>`:`<p class="mu">No officially enrolled students yet (approved enrollments only).</p>`}</div>`}).join("")}
async function render(){
 $("#who").textContent=me?me.full_name+" · "+me.role:"";$("#lo").style.display=me?"":"none";
 if(!configured)return void($("#app").innerHTML=vSetup());
 if(!me)return void($("#app").innerHTML=vLogin());
 let h;try{h=greet()+await({Student:vStudent,Registrar:vRegistrar,Cashier:vCashier,Faculty:vFaculty}[me.role]())}catch(e){h=`<div class="card"><p>Could not load data: ${esc(e.message)}</p></div>`}
 $("#app").innerHTML=h}
(async()=>{if(configured)await loadMe();render()})();
</script></body></html>
